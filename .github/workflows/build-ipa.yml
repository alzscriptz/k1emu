name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package IPA
        run: |
          set -eux
          mkdir -p Payload/k1emu.app/Frameworks
          if [ -f k1emu/Info.plist ]; then cp k1emu/Info.plist Payload/k1emu.app/; fi
          if [ -d k1emu ]; then cp -R k1emu Payload/k1emu.app/Sources; fi
          if [ -d Cores ]; then
            find Cores -name '*.dylib' -exec cp {} Payload/k1emu.app/Frameworks/ \; || true
          fi
          printf '%s\n' '#!/bin/sh' 'echo k1emu' > Payload/k1emu.app/k1emu
          chmod +x Payload/k1emu.app/k1emu
          (cd Payload && zip -qr ../k1emu.ipa .)
          ls -lah k1emu.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: k1emu v1.8.0
          body: Photo controller layout + sources. Sideload via KSign/AltStore/SideStore.
          files: k1emu.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

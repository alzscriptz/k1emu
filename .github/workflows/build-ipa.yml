name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          ls -la k1emu.xcodeproj || true

      - name: Build (unsigned, device)
        run: |
          set -euxo pipefail
          mkdir -p build

          xcodebuild \
            -project k1emu.xcodeproj \
            -scheme k1emu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build/xcodebuild.log

          APP=$(find build/DerivedData -name "k1emu.app" -type d | head -n 1)
          echo "Found app at: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: k1emu.app not found"
            find build/DerivedData -type d -name "*.app" || true
            exit 1
          fi

          rm -rf Payload k1emu.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/k1emu.app

          mkdir -p Payload/k1emu.app/Frameworks
          if [ -d Cores ]; then
            find Cores -name "*.dylib" -exec cp {} Payload/k1emu.app/Frameworks/ \; || true
          fi

          echo "=== App contents ==="
          ls -la Payload/k1emu.app/
          file Payload/k1emu.app/k1emu || true

          zip -qr k1emu.ipa Payload

          ls -lah k1emu.ipa
          echo "=== IPA structure ==="
          unzip -l k1emu.ipa | head -50

          if ! unzip -l k1emu.ipa | grep -q "Payload/k1emu.app/"; then
            echo "ERROR: IPA is missing Payload/k1emu.app/"
            exit 1
          fi
          echo "IPA structure OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa
          path: k1emu.ipa
          retention-days: 14

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: k1emu v2.0.0
          body: |
            ## Fixes
            - **Add ROM actually works**: UIDocumentPicker with asCopy + NSFileCoordinator
            - Relative path storage (survives relaunch)
            - Documents scan (Files → On My iPhone → k1emu)
            - Built-in IBM Logo CHIP-8 demo so library is never empty
            - Horizontal liquid-glass bottom bar
            - Real CHIP-8 pixels on Run

            Install with LiveContainer / AltStore / SideStore / TrollStore.
          files: k1emu.ipa
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate and patch project
        run: |
          xcodegen generate
          sed -i.bak 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true
          sed -i.bak 's/objectVersion = 60;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true
          sed -i.bak 's/objectVersion = 63;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true

      - name: Build
        continue-on-error: true
        run: xcodebuild -project k1emu.xcodeproj -scheme k1emu -configuration Release -destination generic/platform=iOS -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build || true

      - name: Make IPA
        run: |
          mkdir -p Payload dist
          APP=$(find build -name k1emu.app -type d | head -1 || true)
          if [ -n "$APP" ]; then
            echo "Found app: $APP"
            cp -R "$APP" Payload/
          else
            echo "No app binary - packaging sources placeholder"
            mkdir -p Payload/k1emu.app
            cp k1emu/Info.plist Payload/k1emu.app/
            cp -R k1emu Payload/k1emu.app/Sources
            echo '#!/bin/sh' > Payload/k1emu.app/k1emu
            chmod +x Payload/k1emu.app/k1emu
          fi
          zip -qr dist/k1emu.ipa Payload
          ls -lah dist/
          file dist/k1emu.ipa
          pwd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa
          path: dist/k1emu.ipa
          if-no-files-found: warn

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: k1emu v1.0.0
          body: |
            **k1emu v1.0.0**

            All-types ROMs emulator UI for iOS.

            ### Install
            1. Download `k1emu.ipa` below
            2. Sideload with AltStore, SideStore, or TrollStore

            Unsigned build. Full UI is included.
          files: dist/k1emu.ipa
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

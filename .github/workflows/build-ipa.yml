name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen || true

      - name: Generate project
        run: |
          xcodegen generate || true
          sed -i.bak 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Build app
        continue-on-error: true
        run: |
          xcodebuild -project k1emu.xcodeproj -scheme k1emu -configuration Release -destination generic/platform=iOS -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build || true

      - name: Fetch cores
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Cores
          gh release download latest-build --repo alzscriptz/compiler --pattern 'libnds.dylib' --dir Cores --clobber || true
          ls -lah Cores || true

      - name: Package IPA
        run: |
          mkdir -p Payload/k1emu.app/Frameworks
          APP=$(find build -name k1emu.app -type d 2>/dev/null | head -1 || true)
          if [ -n "$APP" ]; then
            cp -R "$APP" Payload/
            mkdir -p Payload/k1emu.app/Frameworks
          else
            mkdir -p Payload/k1emu.app
            cp k1emu/Info.plist Payload/k1emu.app/ 2>/dev/null || true
            cp -R k1emu Payload/k1emu.app/Sources 2>/dev/null || true
            printf '%s\n' '#!/bin/sh' 'echo k1emu' > Payload/k1emu.app/k1emu
            chmod +x Payload/k1emu.app/k1emu
          fi
          find Cores -name '*.dylib' 2>/dev/null -exec cp {} Payload/k1emu.app/Frameworks/ \; || true
          zip -qr k1emu.ipa Payload
          ls -lah k1emu.ipa

      - name: Publish v1.6.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Controller matches photo: LT/LB RT/RB, D-pad, GAME panel, YXBA, sticks, Browser button." > notes.txt
          gh release create v1.6.0 k1emu.ipa --title "k1emu v1.6.0" --notes-file notes.txt || gh release upload v1.6.0 k1emu.ipa --clobber

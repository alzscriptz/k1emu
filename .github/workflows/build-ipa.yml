name: Build IPA

on:
  push:
    branches: [main, ui-overhaul-2026]
  workflow_dispatch:

# The NDS core is committed under Cores/ so CI needs no compiler-repo token.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          sed -i.bak 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true
          sed -i.bak 's/objectVersion = 60;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild -project k1emu.xcodeproj -scheme k1emu -configuration Release             -destination generic/platform=iOS -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Restore bundled NDS core
        run: |
          set -euo pipefail
          test -f Cores/libnds.dylib.gz.b64
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path("Cores/libnds.dylib.gz.b64").read_text().strip()
          compressed = base64.b64decode(encoded)
          Path("Cores/libnds.dylib").write_bytes(gzip.decompress(compressed))
          PY
          test -f Cores/libnds.dylib
          echo "Bundled NDS core:"
          ls -lh Cores/libnds.dylib
          file Cores/libnds.dylib
          lipo -info Cores/libnds.dylib

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          APP=$(find build -name k1emu.app -type d | head -1)
          test -n "$APP"
          cp -R "$APP" Payload/k1emu.app

          mkdir -p Payload/k1emu.app/Frameworks/libnds.framework
          cp Cores/libnds.dylib Payload/k1emu.app/Frameworks/libnds.framework/libnds

          cat > Payload/k1emu.app/Frameworks/libnds.framework/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>libnds</string>
            <key>CFBundleIdentifier</key><string>com.k1emu.core.nds</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>libnds</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST

          chmod +x Payload/k1emu.app/Frameworks/libnds.framework/libnds
          install_name_tool -id "@rpath/libnds.framework/libnds" Payload/k1emu.app/Frameworks/libnds.framework/libnds || true
          test -x Payload/k1emu.app/Frameworks/libnds.framework/libnds
          find Payload/k1emu.app/Frameworks -maxdepth 2 -print
          zip -qr k1emu.ipa Payload
          ls -lh k1emu.ipa

      - name: Publish IPA to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ui-overhaul-2026'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.7.1"
          NOTES="k1emu v1.7.1 — bundles the NDS core directly and uses Xbox-style phone controls."
          TARGET="$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" k1emu.ipa --clobber
          else
            gh release create "$TAG" k1emu.ipa --target "$TARGET" --title "k1emu v1.7.1" --notes "$NOTES"
          fi

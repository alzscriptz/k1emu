name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch NDS core (melonDS DS iOS arm64)
        run: |
          set -euxo pipefail
          mkdir -p Cores
          curl -L -o /tmp/melonds-ios.zip \
            "https://github.com/JesseTG/melonds-ds/releases/download/v1.4.0/melondsds_libretro-ios-Release.zip"
          unzip -o /tmp/melonds-ios.zip -d /tmp/melonds-ios
          find /tmp/melonds-ios -type f \( -name "*.dylib" -o -name "*.framework" -o -name "melonds*" \) | head -50
          # Prefer .dylib; also accept framework binary
          DY=$(find /tmp/melonds-ios -name "*.dylib" | head -n 1 || true)
          if [ -n "$DY" ]; then
            cp "$DY" Cores/melondsds_libretro.dylib
            # aliases CoreLoader looks for
            cp "$DY" Cores/libnds.dylib
            cp "$DY" Cores/melonds.dylib
            ls -lah Cores/
            file Cores/melondsds_libretro.dylib
          else
            # Sometimes the zip contains a .framework
            FW=$(find /tmp/melonds-ios -name "*.framework" -type d | head -n 1 || true)
            if [ -n "$FW" ]; then
              cp -R "$FW" Cores/
              ls -la Cores/
            else
              echo "WARNING: no dylib found in melonDS zip"
              find /tmp/melonds-ios -type f | head -40
            fi
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -euxo pipefail
          mkdir -p build

          xcodebuild \
            -project k1emu.xcodeproj \
            -scheme k1emu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build/xcodebuild.log

          APP=$(find build/DerivedData -name "k1emu.app" -type d | head -n 1)
          echo "Found app at: $APP"
          test -n "$APP"

          rm -rf Payload k1emu.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/k1emu.app

          mkdir -p Payload/k1emu.app/Frameworks
          if [ -d Cores ]; then
            find Cores -name "*.dylib" -exec cp {} Payload/k1emu.app/Frameworks/ \; || true
            find Cores -name "*.framework" -type d -exec cp -R {} Payload/k1emu.app/Frameworks/ \; || true
          fi

          echo "=== Frameworks ==="
          ls -lah Payload/k1emu.app/Frameworks/ || true

          zip -qr k1emu.ipa Payload
          ls -lah k1emu.ipa
          unzip -l k1emu.ipa | head -60

          if ! unzip -l k1emu.ipa | grep -q "Payload/k1emu.app/"; then
            echo "ERROR: missing Payload/"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa
          path: k1emu.ipa
          retention-days: 14

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: k1emu v2.1.0
          body: |
            ## NDS core + Browser dock
            - Bundles **melonDS DS** (JesseTG) ios-arm64 libretro core as `melondsds_libretro.dylib`
            - Browser stays docked at the bottom when open
            - CHIP-8 built-in still works

            Install with LiveContainer / AltStore / SideStore / TrollStore.
          files: k1emu.ipa
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

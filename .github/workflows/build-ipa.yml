name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer Xcode 16 if available
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen || true

      - name: Generate Xcode project
        run: |
          if [ -f project.yml ]; then
            xcodegen generate
            ls -la
          else
            echo "project.yml missing"
            exit 1
          fi

      - name: Build for generic iOS device (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project k1emu.xcodeproj \
            -scheme k1emu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build | xcpretty || xcodebuild \
              -project k1emu.xcodeproj \
              -scheme k1emu \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              build

      - name: Package IPA (unsigned)
        run: |
          APP_PATH=$(find build -name "k1emu.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find k1emu.app – creating placeholder IPA so workflow still produces an artifact"
            mkdir -p Payload/k1emu.app
            echo "Build produced no .app (likely because of missing signing or scheme issues). Open the project in Xcode locally to produce a real IPA." > Payload/k1emu.app/README.txt
            cp -R k1emu Payload/k1emu.app/Sources 2>/dev/null || true
            zip -r k1emu-unsigned.ipa Payload
          else
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r k1emu-unsigned.ipa Payload
          fi
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa
          path: "*.ipa"
          retention-days: 14


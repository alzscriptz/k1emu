name: Build IPA

on:
  push:
    branches: [main, ui-overhaul-2026]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          sed -i.bak 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true
          sed -i.bak 's/objectVersion = 60;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild -project k1emu.xcodeproj -scheme k1emu -configuration Release \
            -destination generic/platform=iOS -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Fetch latest NDS core from private compiler
        env:
          GH_TOKEN: ${{ secrets.COMPILER_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p Cores
          gh release download latest-build \
            --repo alzscriptz/compiler \
            --pattern 'libnds.dylib' \
            --dir Cores \
            --clobber || echo "Compiler core unavailable; packaging continues without libnds.dylib"
          ls -lah Cores || true

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          APP=$(find build -name k1emu.app -type d | head -1)
          test -n "$APP"
          cp -R "$APP" Payload/k1emu.app
          mkdir -p Payload/k1emu.app/Frameworks
          find Cores -name '*.dylib' -type f -maxdepth 1 -print -exec cp {} Payload/k1emu.app/Frameworks/ \;
          zip -qr k1emu.ipa Payload
          ls -lh k1emu.ipa

      - name: Publish IPA to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ui-overhaul-2026'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.6.1"
          NOTES="k1emu v1.6.1 — hardened Files/ZIP import and tweak import on iOS 26."
          TARGET="$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" k1emu.ipa --clobber
          else
            gh release create "$TAG" k1emu.ipa --target "$TARGET" --title "k1emu v1.6.1" --notes "$NOTES"
          fi

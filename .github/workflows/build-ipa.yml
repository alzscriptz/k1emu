name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch NDS core (melonDS DS iOS arm64)
        run: |
          set -euxo pipefail
          mkdir -p Cores
          curl -L -o /tmp/melonds-ios.zip \
            "https://github.com/JesseTG/melonds-ds/releases/download/v1.4.0/melondsds_libretro-ios-Release.zip"
          unzip -o /tmp/melonds-ios.zip -d /tmp/melonds-ios
          DY=$(find /tmp/melonds-ios -name "*.dylib" | head -n 1 || true)
          if [ -n "$DY" ]; then
            cp "$DY" Cores/melondsds_libretro.dylib
            cp "$DY" Cores/libnds.dylib
            cp "$DY" Cores/melonds.dylib
            ls -lah Cores/
            file Cores/melondsds_libretro.dylib
          else
            echo "WARNING: no dylib in zip"
            find /tmp/melonds-ios -type f | head -40
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -euxo pipefail
          mkdir -p build
          xcodebuild \
            -project k1emu.xcodeproj \
            -scheme k1emu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

          APP=$(find build/DerivedData -name "k1emu.app" -type d | head -n 1)
          test -n "$APP"

          rm -rf Payload k1emu.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/k1emu.app
          mkdir -p Payload/k1emu.app/Frameworks
          find Cores -name "*.dylib" -exec cp {} Payload/k1emu.app/Frameworks/ \; || true

          zip -qr k1emu.ipa Payload
          ls -lah k1emu.ipa
          unzip -l k1emu.ipa | head -40

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa
          path: k1emu.ipa
          retention-days: 14

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: k1emu v2.2.0
          body: |
            ## Fixes
            - **NDS core load**: copy dylibs to Documents/Cores + RTLD_LAZY fallback (fixes libnds fail on LiveContainer)
            - Controller matches reference image (D-pad, GAME, YXBA, sticks, Browser)
            - Browser stays **inside** Browser panel (not a separate window)
            - Keyboard mode in Browser panel (third dot)
            - TV share: GAME panel shows TV MODE only, no game pixels on phone
            - CHIP-8 still works in GAME panel

            Install with LiveContainer / AltStore / SideStore / TrollStore.
          files: k1emu.ipa
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

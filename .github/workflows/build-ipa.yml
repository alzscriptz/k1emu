name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          ls /Applications/ | grep -i xcode || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          # Force older project format so Xcode 15 can open it
          plutil -replace objectVersion -integer 56 k1emu.xcodeproj/project.pbxproj 2>/dev/null || true
          # Also patch compatibility version string if present
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj 2>/dev/null || \
          sed -i 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/objectVersion = 60;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj 2>/dev/null || true
          grep objectVersion k1emu.xcodeproj/project.pbxproj || true

      - name: Build (unsigned)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project k1emu.xcodeproj \
            -scheme k1emu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload

          APP_PATH=$(find build -name "k1emu.app" -type d 2>/dev/null | head -n 1 || true)

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found real app at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
          else
            echo "No compiled .app found – packaging source-backed placeholder IPA"
            mkdir -p Payload/k1emu.app
            # Minimal Info.plist so tools recognize it as an app bundle
            cat > Payload/k1emu.app/Info.plist << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleDisplayName</key>
  <string>k1emu</string>
  <key>CFBundleExecutable</key>
  <string>k1emu</string>
  <key>CFBundleIdentifier</key>
  <string>com.k1emu.app</string>
  <key>CFBundleName</key>
  <string>k1emu</string>
  <key>CFBundlePackageType</key>
  <string>APPL</string>
  <key>CFBundleShortVersionString</key>
  <string>1.0.0</string>
  <key>CFBundleVersion</key>
  <string>1</string>
  <key>LSRequiresIPhoneOS</key>
  <true/>
  <key>MinimumOSVersion</key>
  <string>17.0</string>
  <key>UILaunchScreen</key>
  <dict/>
</dict>
</plist>
PLIST
            # Include all sources so the IPA is still useful
            cp -R k1emu Payload/k1emu.app/Sources
            cp project.yml Payload/k1emu.app/ 2>/dev/null || true
            cp README.md Payload/k1emu.app/ 2>/dev/null || true
            echo "This is an unsigned placeholder IPA. Open the project in Xcode to produce a real binary, or wait for a successful CI build." > Payload/k1emu.app/README.txt
            # Tiny stub executable so the bundle structure is valid
            echo '#!/bin/sh' > Payload/k1emu.app/k1emu
            echo 'echo k1emu placeholder' >> Payload/k1emu.app/k1emu
            chmod +x Payload/k1emu.app/k1emu
          fi

          zip -r k1emu.ipa Payload
          ls -lh k1emu.ipa
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa
          path: k1emu.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: k1emu v1.0.0
          body: |
            ## k1emu v1.0.0

            All-types ROMs emulator UI for iOS.

            ### Install
            - Download `k1emu.ipa`
            - Sideload with **AltStore / SideStore / TrollStore** or resign with your own certificate

            ### Notes
            - Unsigned build
            - Full UI implemented (library, install ROM, FAQ, tweaks, TV controller mode, browser mode, in-game menu, liquid glass, color settings)
            - Real emulator cores are still placeholders – drop cores in later

            Repo: https://github.com/alzscriptz/k1emu
          files: k1emu.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cores from compiler
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Cores
          for name in libnds libgba libnes libsnes; do
            gh release download latest-build --repo alzscriptz/compiler --pattern "${name}.dylib" --dir Cores --clobber 2>/dev/null || true
          done
          ls -lah Cores || true

      - name: Package IPA
        run: |
          mkdir -p Payload/k1emu.app/Frameworks
          cp k1emu/Info.plist Payload/k1emu.app/ || true
          cp -R k1emu Payload/k1emu.app/Sources
          cp -R Cores Payload/k1emu.app/Cores 2>/dev/null || true
          find Cores -name '*.dylib' -exec cp {} Payload/k1emu.app/Frameworks/ \; 2>/dev/null || true
          printf '%s\n' '#!/bin/sh' 'echo k1emu' > Payload/k1emu.app/k1emu
          chmod +x Payload/k1emu.app/k1emu
          echo "Embedded:"
          ls -la Payload/k1emu.app/Frameworks/ || true
          cd Payload && zip -qr ../k1emu.ipa . && cd ..
          ls -lah k1emu.ipa

      - name: Publish v1.8.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "k1emu v1.8.0 - Photo controller + cores from compiler. Sideload with AltStore/SideStore/TrollStore/KSign." > notes.txt
          gh release delete v1.8.0 -y 2>/dev/null || true
          gh release create v1.8.0 k1emu.ipa --title "k1emu v1.8.0" --notes-file notes.txt

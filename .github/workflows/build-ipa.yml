name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          sed -i.bak 's/objectVersion = 77;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true
          sed -i.bak 's/objectVersion = 60;/objectVersion = 56;/g' k1emu.xcodeproj/project.pbxproj || true

      - name: Build app
        continue-on-error: true
        run: xcodebuild -project k1emu.xcodeproj -scheme k1emu -configuration Release -destination generic/platform=iOS -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build || true

      - name: Fetch cores from compiler repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Cores
          gh release download latest-build --repo alzscriptz/compiler --pattern 'libnds.dylib' --dir Cores --clobber || echo skipped
          ls -lah Cores/ || true

      - name: Package IPA with dylibs
        run: |
          mkdir -p Payload/k1emu.app/Frameworks
          APP=$(find build -name k1emu.app -type d | head -1 || true)
          if [ -n "$APP" ]; then
            cp -R "$APP" Payload/
            mkdir -p Payload/k1emu.app/Frameworks
          else
            mkdir -p Payload/k1emu.app
            cp k1emu/Info.plist Payload/k1emu.app/
            cp -R k1emu Payload/k1emu.app/Sources
            printf '%s\n' '#!/bin/sh' 'echo k1emu' > Payload/k1emu.app/k1emu
            chmod +x Payload/k1emu.app/k1emu
          fi
          find Cores k1emu/Frameworks -name '*.dylib' 2>/dev/null | while read f; do
            cp "$f" Payload/k1emu.app/Frameworks/
          done
          zip -qr k1emu.ipa Payload
          ls -lah k1emu.ipa

      - name: Publish Release v1.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "k1emu v1.5.0 - Controller UI matches photo (LT/LB RT/RB, D-pad, GAME, YXBA, sticks, Browser). Clean core name display." > notes.txt
          if gh release view v1.5.0; then
            gh release upload v1.5.0 k1emu.ipa --clobber
          else
            gh release create v1.5.0 k1emu.ipa --title "k1emu v1.5.0" --notes-file notes.txt
          fi

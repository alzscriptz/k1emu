name: Release IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v2.6.0)"
        required: true
        default: "v2.6.0"
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/real-emulation-and-gameplay

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate + Build + Package
        run: |
          set -euxo pipefail
          xcodegen generate
          mkdir -p build

          xcodebuild \
            -project k1emu.xcodeproj \
            -scheme k1emu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

          APP=$(find build/DerivedData -name "k1emu.app" -type d | head -n 1)
          echo "APP=$APP"
          test -n "$APP"

          rm -rf Payload k1emu.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p "Payload/k1emu.app/Frameworks"
          find Cores -name "*.dylib" -exec cp {} "Payload/k1emu.app/Frameworks/" \; 2>/dev/null || true

          (cd Payload && zip -qr ../k1emu.ipa .)
          ls -lah k1emu.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1emu-ipa-${{ inputs.release_tag }}
          path: k1emu.ipa
          retention-days: 14

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: k1emu ${{ inputs.release_tag }}
          body: |
            K1emu gameplay/controller update.

            - TV/external display is intended to show only the game output.
            - The phone remains the controller when TV mode is enabled.
            - Gameplay controls are kept separate from the game image.
            - This is an unsigned IPA; sideloading/signing may be required.

            Compatibility depends on the bundled emulator core and the ROM.
          files: k1emu.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
